<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><link rel="stylesheet" href="./launcher.css"><title>pvz_perf · Web 试验版</title>
<body>
<header><div><strong>pvz_perf</strong><span class="tag">Web 试验版</span></div><div class="toolbar"><span id="viewport-info"></span></div></header>
<main><div class="stage" id="stage">
<canvas id="canvas" width="800" height="600" tabindex="0" aria-label="植物大战僵尸游戏画面" oncontextmenu="event.preventDefault()"></canvas>
<output id="game-fps" hidden title="游戏绘制计数；实际呈现还受屏幕和浏览器限制">FPS —</output>
<section id="cover"><form id="launch-form" class="panel">
<p class="eyebrow">PLANTS VS. ZOMBIES · WEB</p><h1>植物大战僵尸 · 网页</h1><p class="intro">设置好画面与帧率，进入游戏。</p>
<div class="settings">
<label class="field"><span>目标帧率</span><input id="target-fps" type="number" min="30" max="1000000000" step="1" value="100" required><small>最低 30 FPS；实际绘制受浏览器与屏幕限制。</small></label>
<label class="field"><span>画面比例</span><select id="aspect"><option value="auto">随可用窗口自动调整</option><option value="4:3">4:3</option><option value="16:9">16:9</option><option value="21:9">21:9</option></select><small>保持比例，不拉伸；超出 4:3～21:9 的部分留黑边。</small></label>
<label class="check"><input id="auto-fps" type="checkbox" checked><span>自动跟随浏览器刷新节奏<small id="refresh-info">正在估算…</small></span></label>
<label class="check"><input id="landscape-ui" type="checkbox"><span>使用横板 UI<small>窗口较窄时回退桌面 UI，布局在启动时确定。</small></span></label>
<label class="field volume"><span>音效音量 <output id="volume-value">100</output></span><input id="sfx-volume" type="range" min="0" max="100" value="100"><small>背景音乐由浏览器音频线程播放，音量也可在游戏内调整。</small></label>
<div class="field"><span>预置存档</span><small>领取会替换本地 PerfTest 用户资料；无尽导入还会替换泳池无尽进度。均已购买坚果包扎术。</small><button id="claim-perfect" class="secondary" type="button">领取完美存档</button><select id="endless-preset" aria-label="无尽阵型"></select><button id="claim-endless" class="secondary" type="button">导入所选无尽存档</button><button id="reset-baseline" class="secondary" type="button">重置无尽基准与完美存档</button><small id="reward-status" role="status" aria-live="polite"></small></div>
</div>
<div class="launch-row"><div class="load-state"><span id="status" role="status" aria-live="polite">正在加载程序和资源…</span><progress id="progress"></progress></div><button id="start" type="submit" disabled>开始游戏</button></div>
<p class="note">设置和用户资料保存在当前浏览器。请通过游戏菜单正常退出。</p>
</form></section><div id="error" role="alert" hidden></div>
</div></main>
<form id="web-text-input" hidden><label for="web-text-value">游戏文本输入（ASCII）</label><input id="web-text-value" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button type="submit">完成</button></form>
<footer><span>点击／拖动 · 空格暂停 · Esc 菜单</span><span>基于 <a href="https://github.com/wszqkzqk/PvZ-Portable" target="_blank" rel="noopener">PvZ-Portable</a> 修改 · <a href="https://github.com/YuHao2006/pvz_perf" target="_blank" rel="noopener">源码与原生版</a></span></footer>
<script src="./web-config.js"></script><script src="./launcher.js"></script></body></html>
